<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Manage backends</title>
    <style>
      body {
        font-family: -apple-system, "Segoe UI", sans-serif;
        margin: 0;
        padding: 24px;
        background: #1e1f22;
        color: #dcddde;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 16px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        border-radius: 6px;
        border: 1px solid #3a3b3e;
        background: #2b2d31;
        color: inherit;
        margin-bottom: 10px;
        font-size: 14px;
      }
      button {
        width: 100%;
        padding: 8px 10px;
        border-radius: 6px;
        border: none;
        background: #5865f2;
        color: white;
        font-size: 14px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #error {
        color: #f88;
        font-size: 13px;
        min-height: 18px;
        margin-top: 8px;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 16px 0 0;
      }
      li {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 6px;
      }
      li:hover {
        background: #2b2d31;
      }
      li .label {
        flex: 1;
        cursor: pointer;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      li .rename,
      li .remove {
        width: auto;
        padding: 4px 8px;
        font-size: 12px;
        background: transparent;
        opacity: 0;
      }
      li .rename {
        color: #9aa0ff;
      }
      li .remove {
        color: #f88;
      }
      li:hover .rename,
      li:hover .remove {
        opacity: 1;
      }
      li .label-text {
        font-weight: 500;
      }
      li .label-url {
        opacity: 0.6;
        font-size: 12px;
        display: block;
      }
      h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        opacity: 0.6;
        margin: 20px 0 6px;
      }
      #existing:empty::before {
        content: "No backends configured yet.";
        display: block;
        opacity: 0.5;
        font-size: 13px;
        padding: 8px 10px;
      }
    </style>
  </head>
  <body>
    <h1>Manage backends</h1>
    <h2>Connected</h2>
    <ul id="existing"></ul>
    <h2>Add a backend</h2>
    <input id="url" type="text" placeholder="chat.example.com" autofocus />
    <input id="name" type="text" placeholder="Label (optional)" />
    <button id="connect">Connect</button>
    <div id="error"></div>
    <script src="picker.js"></script>
  </body>
</html>
